<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Mapa de Fornecedores</title>
<style>
  :root {
    --ink: #1f2328; --body: #5e6470; --line: #e6e8eb; --soft: #f2f4f6; --accent: #2563eb; --accent-hover: #1d4ed8;
    --font: Inter, system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
  }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 16px;
    font: 400 15px/22px var(--font); color: var(--ink); background: var(--soft); }
  .card { width: 100%; max-width: 420px; background: #fff; border-radius: 16px; box-shadow: 0 4px 16px rgba(0, 0, 0, .10); padding: 28px 24px; }
  h1 { font: 700 20px/28px var(--font); margin: 0; }
  .sub { color: var(--body); font-size: 13px; margin: 4px 0 20px; }
  .btn { display: block; width: 100%; border: 0; border-radius: 999px; padding: 13px 20px; font: 500 16px/20px var(--font); cursor: pointer; }
  .btn-primary { background: var(--accent); color: #fff; }
  .btn-primary:hover { background: var(--accent-hover); }
  .btn-subtle { background: var(--soft); color: var(--ink); margin-top: 16px; }
  .btn-subtle:hover { background: var(--line); }
  .ok { background: #e7f6ee; color: #146c43; border-radius: 12px; padding: 12px 14px; margin-bottom: 8px; font-weight: 500; }
  .err { background: #fdecec; color: #b42318; border-radius: 12px; padding: 12px 14px; margin-bottom: 16px; }
  .m { color: var(--body); font-size: 13px; line-height: 19px; }
  dl { margin: 0 0 12px; }
  dt { color: var(--body); font-size: 12px; margin-top: 12px; }
  dd { margin: 0; font-weight: 500; word-break: break-word; }
</style>
</head>
<body>
<main class="card">
  <h1>Mapa de Fornecedores</h1>
  <p class="sub">Acesso com a conta Microsoft da Transmaroni</p>
  <div id="conteudo"><p class="m">Verificando acesso…</p></div>
</main>
<script src="vendor/msal-browser.min.js"></script>
<script>
// Etapa 1 da publicação: só o login com a conta Microsoft da empresa. Nenhum dado de fornecedor fica nesta página.
// Registro no Entra ID: "Mapa de Fornecedores - Manutenção", locatário único Transmaroni (IDs públicos, não são senha).
// MSAL 5: a resposta da Microsoft chega em redirect.html (ponte servida por este mesmo site) e volta para cá.
const PASTA = location.origin + location.pathname.replace(/[^/]*$/, '');
const pca = new msal.PublicClientApplication({
  auth: {
    clientId: 'be92c8b6-d0fc-40e3-8e5c-f75de940e41b',
    authority: 'https://login.microsoftonline.com/8babaf2b-248f-4651-98d6-1e5312fbe00a',
    redirectUri: PASTA + 'redirect.html',
    postLogoutRedirectUri: PASTA + 'redirect.html'
  },
  cache: { cacheLocation: 'localStorage' }   // continua conectado ao reabrir o site no celular
});
const ESCOPOS = ['User.Read'];
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
// o MSAL 5 devolve só o código do erro; aqui ele vira uma mensagem para a pessoa
const ERROS = {
  consent_required: 'O acesso precisa ser aprovado por um administrador da Transmaroni no Azure.',
  interaction_required: 'É preciso entrar de novo.',
  login_required: 'Sua sessão expirou. Entre de novo.',
  access_denied: 'O login foi cancelado ou não foi autorizado.'
};

function telaEntrar(aviso) {
  $('conteudo').innerHTML = (aviso ? `<div class="err">${esc(aviso)}</div>` : '') +
    '<button class="btn btn-primary" id="entrar">Entrar com a conta Microsoft</button>' +
    '<p class="m" style="margin-top:14px">Use o mesmo e-mail e senha do Outlook. A senha é digitada na página da Microsoft: este site não a vê nem guarda.</p>';
  $('entrar').onclick = () => pca.loginRedirect({ scopes: ESCOPOS });
}

async function iniciar() {
  try {
    await pca.initialize();
    const r = await pca.handleRedirectPromise();
    const conta = r?.account || pca.getActiveAccount() || pca.getAllAccounts()[0];
    if (!conta) return telaEntrar();
    pca.setActiveAccount(conta);
    let perfil = null;
    try {
      const t = await pca.acquireTokenSilent({ scopes: ESCOPOS, account: conta });
      const resp = await fetch('https://graph.microsoft.com/v1.0/me?$select=displayName,userPrincipalName,userType',
        { headers: { Authorization: 'Bearer ' + t.accessToken } });
      if (resp.ok) perfil = await resp.json();
    } catch (e) {
      if (e.errorCode === 'interaction_required' || e.errorCode === 'login_required') return telaEntrar(ERROS[e.errorCode]);
      throw e;
    }
    const tipo = perfil?.userType === 'Guest' ? 'Convidado (externo)' : perfil?.userType === 'Member' ? 'Colaborador' : 'não informado';
    $('conteudo').innerHTML = `<div class="ok">Login funcionando</div>
      <dl><dt>Nome</dt><dd>${esc(perfil?.displayName || conta.name)}</dd>
      <dt>E-mail</dt><dd>${esc(perfil?.userPrincipalName || conta.username)}</dd>
      <dt>Tipo de conta</dt><dd>${esc(tipo)}</dd></dl>
      <p class="m">Primeira etapa concluída. O mapa com os fornecedores entra nesta página quando a pasta de dados no SharePoint estiver pronta.</p>
      <button class="btn btn-subtle" id="sair">Sair deste site</button>`;
    // sai só deste site (apaga a sessão guardada aqui), sem desconectar o Outlook e os outros aplicativos da Microsoft
    $('sair').onclick = async () => { await pca.clearCache({ account: conta }); location.reload(); };
  } catch (e) {
    telaEntrar((ERROS[e.errorCode] || 'Não foi possível entrar.') + (e.errorCode ? ` (código: ${e.errorCode})` : ''));
  }
}
iniciar();
</script>
</body>
</html>
